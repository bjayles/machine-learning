[project]
name = "hdb-resale"
version = "0.1.0"
description = "Fair resale price estimator for Singapore HDB flats"
readme = "README.md"
authors = [
    { name = "Bertrand Jayles", email = "bertrand.jayles@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
hdb-resale = "hdb_resale.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[tool.uv]
# Installed by a plain `uv sync`; production images will skip both (step 6)
default-groups = ["dev", "notebooks"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) + bugs, modern syntax, readability, docstrings, naming
select = [
    "E4", "E7", "E9", "F",  # Ruff defaults: real errors
    "I",                    # import sorting
    "UP",                   # modern Python syntax
    "B",                    # likely bugs
    "SIM",                  # simpler equivalent code
    "RUF",                  # Ruff's own best practices
    "D",                    # docstrings
    "N",                    # naming conventions
    "ERA",                  # commented-out code
    "C90",                  # function complexity
]

[tool.ruff.lint.per-file-ignores]
# Test names say what they check: docstrings optional in tests
"tests/**" = ["D1"]

[tool.ruff.lint.isort]
# Sort our own package's imports after third-party ones
known-first-party = ["hdb_resale"]
# Test helpers imported by the tests (tests/factories.py), sorted last
known-local-folder = ["factories"]

[tool.ruff.lint.pydocstyle]
convention = "google"
